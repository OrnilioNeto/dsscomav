---
deployment:
  tasks:
    - export COMPOSER_HOME=/var/composer
    - export PATH=/opt/cpanel/composer/bin:$PATH
    - 'if [ -x /opt/cpanel/ea-php83/root/usr/bin/php ]; then PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php; elif [ -x /usr/local/bin/php ]; then PHP_BIN=/usr/local/bin/php; else PHP_BIN=$(command -v php); fi'
    - 'if command -v composer >/dev/null 2>&1; then COMPOSER_BIN=$(command -v composer); elif [ -x /opt/cpanel/composer/bin/composer ]; then COMPOSER_BIN=/opt/cpanel/composer/bin/composer; elif [ -x /bin/composer ]; then COMPOSER_BIN=/bin/composer; else echo "Composer nao encontrado"; exit 1; fi'
    - '$COMPOSER_BIN install --no-dev --optimize-autoloader --prefer-dist --no-interaction'
    - 'if [ ! -f .env ]; then cp .env.production.example .env; fi'
    - '$PHP_BIN artisan key:generate --force || true'
    - '$PHP_BIN artisan config:clear'
    - '$PHP_BIN artisan route:clear'
    - '$PHP_BIN artisan view:clear'
    - '$PHP_BIN artisan migrate --force'
    - '$PHP_BIN artisan config:cache'
    - '$PHP_BIN artisan route:cache'
    - '$PHP_BIN artisan view:cache'
