deployment:
  tasks:
    # 1. GARANTE CONTEXTO DO PROJETO (CRÍTICO)
    - cd /home/prev0142/repositories/dsscomavprod

    # 2. CONFIGURA AMBIENTE DO COMPOSER
    - export COMPOSER_HOME=/var/composer
    - export PATH=/opt/cpanel/composer/bin:$PATH

    # 3. DETECTA PHP AUTOMATICAMENTE (cPanel seguro)
    - >
      if [ -x /opt/cpanel/ea-php83/root/usr/bin/php ]; then
        PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php;
      elif [ -x /usr/local/bin/php ]; then
        PHP_BIN=/usr/local/bin/php;
      else
        PHP_BIN=$(command -v php);
      fi

    # 4. DETECTA COMPOSER
    - >
      if command -v composer >/dev/null 2>&1; then
        COMPOSER_BIN=$(command -v composer);
      elif [ -x /opt/cpanel/composer/bin/composer ]; then
        COMPOSER_BIN=/opt/cpanel/composer/bin/composer;
      elif [ -x /bin/composer ]; then
        COMPOSER_BIN=/bin/composer;
      else
        echo "Composer nao encontrado"; exit 1;
      fi

    # 5. INSTALA DEPENDÊNCIAS (SEM DEV)
    - $COMPOSER_BIN install --no-dev --optimize-autoloader --prefer-dist --no-interaction

    # 6. CRIA .ENV SE NÃO EXISTIR
    - >
      if [ ! -f .env ]; then
        cp .env.production.example .env;
      fi

    # 7. LIMPEZA TOTAL LARAVEL (EVITA ERRO "Finder.php")
    - $PHP_BIN artisan optimize:clear || true

    # 8. GERA APP KEY (SEGURA PARA PRIMEIRO DEPLOY)
    - $PHP_BIN artisan key:generate --force || true

    # 9. MIGRAÇÕES SEGURAS (NUNCA QUEBRA DEPLOY)
    - $PHP_BIN artisan migrate --force || true

    # 9.1. SEEDS IDempotentes PARA GARANTIR USUÁRIOS BASE
    - $PHP_BIN artisan db:seed --force || true

    # 10. CACHE DE PRODUÇÃO
    - $PHP_BIN artisan config:cache || true
    - $PHP_BIN artisan route:cache || true
    - $PHP_BIN artisan view:cache || true