services:
  app-dss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-dss
    entrypoint: ["/bin/sh", "/var/www/app/docker/entrypoint.sh"]
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "9000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:9000
      PHP_CLI_SERVER_WORKERS: "4"
    depends_on:
      - db
    volumes:
      - .:/var/www/app
      - app_storage:/var/www/app/storage
      - ./storage/logs:/var/www/app/storage/logs
      - ./public/images:/var/www/app/public/images
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro

  db:
    image: mariadb:11
    container_name: dss-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: dss_db
      MYSQL_USER: dss_user
      MYSQL_PASSWORD: dss_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: dss-adminer
    restart: always
    environment:
      UPLOAD: 4096M
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8001:8080"
    depends_on:
      - db

volumes:
  app_storage:
  mariadb_data: